<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>부산 공영주차장 찾기</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <header>
      <h1>🅿 부산 공영주차장 찾기</h1>

      <p>
        부산 공영주차장의 위치와 주차정보를 확인할 수 있습니다.
      </p>
    </header>

    <section class="card">
      <h2>공영주차장 목록</h2>

      <div class="search-box">
        <input
          id="search-input"
          type="search"
          placeholder="주차장명을 입력하세요"
          aria-label="주차장명 검색"
        >

        <button id="search-button" type="button">
          검색
        </button>

        <button
          id="reset-button"
          class="secondary-button"
          type="button"
        >
          전체보기
        </button>
      </div>

      <p id="status-message">
        주차장 정보를 준비하고 있습니다.
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>주차장 코드</th>
              <th>주차장명</th>
              <th>실시간 정보</th>
            </tr>
          </thead>

          <tbody id="parking-list">
            <!-- app.js에서 목록을 추가합니다. -->
          </tbody>
        </table>
      </div>

      <section
        id="realtime-panel"
        class="realtime-panel"
        hidden
      >
        <div class="realtime-header">
          <h3 id="realtime-name">
            실시간 주차정보
          </h3>

          <button
            id="close-realtime-button"
            type="button"
            aria-label="실시간 정보 닫기"
          >
            닫기
          </button>
        </div>

        <div class="realtime-grid">
          <div class="info-box">
            <span class="info-label">전체 주차면</span>
            <strong id="maximum-count">-</strong>
          </div>

          <div class="info-box">
            <span class="info-label">현재 주차</span>
            <strong id="parking-count">-</strong>
          </div>

          <div class="info-box available-box">
            <span class="info-label">주차 가능</span>
            <strong id="available-count">-</strong>
          </div>
        </div>

        <p id="last-update-time" class="update-time">
          최종 갱신 시각: -
        </p>
      </section>

      <div id="pagination" class="pagination">
        <button id="prev-button" type="button">
          이전
        </button>

        <span id="page-info">
          1 / 1
        </span>

        <button id="next-button" type="button">
          다음
        </button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
