<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>부산 공영주차장 찾기</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <header>
      <h1>🅿 부산 공영주차장 찾기</h1>

      <p>
        부산 공영주차장의 위치와 주차정보를 확인할 수 있습니다.
      </p>
    </header>

    <section class="card">
      <h2>공영주차장 목록</h2>

      <p id="status-message">
        주차장 정보를 준비하고 있습니다.
      </p>

      <table>
        <thead>
          <tr>
            <th>주차장 코드</th>
            <th>주차장명</th>
          </tr>
        </thead>

        <tbody id="parking-list">
          <!-- app.js에서 주차장 목록을 추가합니다. -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
